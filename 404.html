<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | Nalomy</title>
    <meta name="description" content="La página que buscas no existe o ha sido movida. Vuelve al inicio de Nalomy.">

    <!-- Iconos de marca -->
    <link rel="icon" type="image/png" href="imagenes/Hero/el_logo-nalomy.png">

    <!-- Preconexión y carga de fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Estilos CSS de tu sitio -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* Estilos específicos para centrar el mensaje de error 404 */
        .contenedor-404 {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .titulo-404 {
            font-family: 'Noto Serif', serif;
            font-size: 5rem;
            margin: 0;
            color: var(--dorado-suave, #d4af37);
        }

        .subtitulo-404 {
            font-family: 'Noto Serif', serif;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }

        .texto-404 {
            font-family: 'Noto Sans', sans-serif;
            font-size: 1rem;
            max-width: 450px;
            margin-bottom: 2rem;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <main class="contenedor-404">
        <h1 class="titulo-404">404</h1>
        <h2 class="subtitulo-404">Página no encontrada</h2>
        <p class="texto-404">
            Parece que el enlace que buscas no existe o ha cambiado de lugar.
        </p>
        <a href="/" class="btn-whatsapp-precio" style="text-decoration: none; display: inline-block;">
            <span class="btn-texto">← Volver al inicio</span>
        </a>
    </main>

</body>

</html>
